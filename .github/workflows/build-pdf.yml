name: Build and publish Alan pas riche

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compile Alan pas riche
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t alan-pas-riche-builder .

      - name: Compile PDF and EPUB
        run: |
          docker run --rm             --volume "$PWD:/data"             alan-pas-riche-builder

      - name: Check generated files
        run: |
          test -f aventures.pdf
          test -f aventures.epub
          ls -lh aventures.pdf aventures.epub

      - name: Prepare GitHub Pages
        run: |
          rm -rf _site
          mkdir -p _site

          cp aventures.pdf _site/aventures.pdf
          cp aventures.epub _site/aventures.epub

          cat > _site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Alan pas riche</title>
          </head>
          <body>
            <h1>Alan pas riche</h1>
            <p>Les aventures de Kael, Morrÿs et Obélik.</p>

            <p>
              <a href="aventures.pdf?v=${GITHUB_SHA}">
                Télécharger le récit au format PDF
              </a>
            </p>

            <p>
              <a href="aventures.epub?v=${GITHUB_SHA}">
                Télécharger le récit au format EPUB
              </a>
            </p>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
